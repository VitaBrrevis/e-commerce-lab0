name: CI/CD — build, push, scan

on:
  push:
    branches-ignore:
      # Lab 3 branch: KinD + k8s only via lab3.yml
      - Laba3

permissions:
  contents: read
  packages: write

jobs:
  build-push-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export image variables
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${owner_lc}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "IMAGE_BASE=ghcr.io/${owner_lc}/ecommerce-app" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:sha-${{ env.SHORT_SHA }}

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: "${{ env.IMAGE_BASE }}:sha-${{ env.SHORT_SHA }}"
          format: table
          exit-code: "0"
          vuln-type: os,library

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Master Validation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x ./tests/lab2_test.sh
          ./tests/lab2_test.sh
