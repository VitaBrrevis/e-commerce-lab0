name: Lab 4 — Helm Charts & Templating

on:
  push:
    branches:
      - Laba4
  pull_request:
    branches:
      - Laba4

jobs:
  helm-lab4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lab4

      - name: Run Lab 4 grading script
        run: |
          chmod +x ./tests/lab4_test.sh
          ./tests/lab4_test.sh
